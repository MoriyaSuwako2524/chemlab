[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chemlab"
version = "0.2.2"
description = "Utilities for Q-Chem workflows"
authors = [
    { name="moriya2524", email="suwako2524@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy","matplotlib","scikit-learn", "tomli; python_version < '3.11'"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.setuptools.package-data]
chemlab = ["config/*.toml"]

[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
chemlab = "chemlab.__main__:main"


